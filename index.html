<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Sharon</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{--wine:#3b0a1b;--wine2:#5a1230;--gold:#f4b400;--amber:#e08a00;--ink:#0f070c;--cream:#fff1d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--ink);color:var(--cream);overflow:hidden;font-family:'Cormorant Garamond',Georgia,serif;-webkit-tap-highlight-color:transparent}
#st{position:relative;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 100%,#2a0f1c 0,var(--ink) 70%)}
#spot{position:absolute;inset:0;background:linear-gradient(rgba(255,226,160,.34),rgba(255,226,160,0) 85%);clip-path:polygon(44% 0,56% 0,98% 100%,2% 100%);opacity:0;transition:opacity 2.2s ease}
.lit #spot{opacity:1}
#halo{position:absolute;left:50%;top:6svh;width:90vw;max-width:480px;aspect-ratio:1;transform:translateX(-50%) scale(.6);border-radius:50%;background:radial-gradient(circle,rgba(244,180,0,.32),transparent 65%);opacity:0;transition:all 2.4s ease}
.halo #halo{opacity:1;transform:translateX(-50%) scale(1)}
#plant{position:absolute;left:50%;top:3svh;height:56svh;aspect-ratio:300/470;transform:translateX(-50%);overflow:visible}
#sway{transform-origin:150px 470px}
.halo #sway{animation:sway 6s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(1.6deg)}0%,100%{transform:rotate(-1.6deg)}}
#stem{fill:none;stroke:#3f7d2e;stroke-width:7;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.grow #stem{animation:draw 2s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.lf{fill:#4f9a3a;transform-box:fill-box;transform:scale(0);opacity:0}
.lf.a{transform-origin:100% 50%}.lf.b{transform-origin:0 50%}
.go .lf{animation:pop 1.2s ease-out forwards}.go .lf.b{animation-delay:.4s}
@keyframes pop{to{transform:scale(1);opacity:1}}
.pt,.ct{transform-box:fill-box;transform:scale(0)}
.pt{transform-origin:50% 100%}.ct{transform-origin:50% 50%}
.go .pt{animation:bloom 1s cubic-bezier(.2,1.35,.4,1) forwards}
.go .ct{animation:bloom 1.4s ease-out forwards}
@keyframes bloom{to{transform:scale(1)}}
#msg{position:absolute;left:0;right:0;bottom:6svh;padding:0 24px;text-align:center;z-index:3}
.ln{opacity:0;filter:blur(6px);transform:translateY(8px);transition:all 1.8s ease}
.ln.show{opacity:1;filter:blur(0);transform:none}
.n{font-family:'Pinyon Script',cursive;font-size:clamp(46px,14vw,70px);color:var(--gold);text-shadow:0 0 24px rgba(244,180,0,.55);line-height:1}
.s{font-size:clamp(19px,5.4vw,24px);margin:10px 0 4px;opacity:.92}
.m{font-size:clamp(25px,7vw,32px);font-weight:600;margin:4px 0}
.f{font-family:'Pinyon Script',cursive;font-size:clamp(34px,10vw,46px);color:var(--gold);text-shadow:0 0 22px rgba(244,180,0,.6);margin-top:4px}
.f i{font-style:normal;display:inline-block;color:#ff5c7a;text-shadow:0 0 18px rgba(255,92,122,.7)}
.end .f i{animation:beat 1.3s ease-in-out infinite}
@keyframes beat{15%{transform:scale(1.28)}30%{transform:scale(1)}45%{transform:scale(1.2)}60%{transform:scale(1)}}
.fp{position:absolute;top:-30px;width:13px;height:21px;border-radius:50% 50% 50% 50%/70% 70% 30% 30%;background:linear-gradient(#ffd34d,var(--amber));opacity:.9;z-index:2;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--dx),112svh,0) rotate(var(--r))}}
.c{position:absolute;top:0;bottom:0;width:51%;z-index:5;background:repeating-linear-gradient(90deg,var(--wine) 0 16px,var(--wine2) 36px,var(--wine) 56px);box-shadow:0 0 40px rgba(0,0,0,.7);transition:transform 2.8s cubic-bezier(.7,0,.2,1)}
.c.l{left:0;border-right:2px solid rgba(244,180,0,.5)}.c.r{right:0;border-left:2px solid rgba(244,180,0,.5)}
.open .c.l{transform:translateX(-102%)}.open .c.r{transform:translateX(102%)}
#intro{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;transition:opacity .8s ease;padding:0 24px}
.open #intro{opacity:0;pointer-events:none}
#intro .a{font-family:'Pinyon Script',cursive;font-size:clamp(56px,17vw,84px);color:var(--gold);margin:0;text-shadow:0 0 26px rgba(244,180,0,.5)}
#intro .b{font-size:clamp(22px,6vw,28px);margin:6px 0 40px}
#intro .h{font-size:18px;opacity:.8;margin:0;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
#again{position:absolute;right:16px;top:8px;z-index:4;background:none;border:0;color:var(--cream);font:inherit;font-size:16px;opacity:0;transition:opacity 1.5s;padding:8px}
#again.show{opacity:.55}
#pz{opacity:0;transform-origin:85px 0;transform:translateY(-520px) rotate(-28deg)}
.pho #pz{animation:drop 3.2s cubic-bezier(.3,.6,.4,1) forwards,hang 5s ease-in-out 3.2s infinite}
@keyframes drop{0%{opacity:0;transform:translate(-40px,-520px) rotate(-28deg)}15%{opacity:1}45%{transform:translate(34px,-210px) rotate(18deg)}70%{transform:translate(-14px,-60px) rotate(-9deg)}100%{opacity:1;transform:translate(0,0) rotate(3deg)}}
@keyframes hang{0%,100%{transform:rotate(3deg)}50%{transform:rotate(-3deg)}}
#mem{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 2svh);transform:translateX(-50%);z-index:4;background:rgba(59,10,27,.6);color:var(--cream);border:1px solid rgba(244,180,0,.6);border-radius:999px;padding:10px 22px;font:italic 600 20px 'Cormorant Garamond',Georgia,serif;opacity:0;pointer-events:none;transition:opacity 1.5s;white-space:nowrap}
#mem.show{opacity:1;pointer-events:auto}
#gal{position:absolute;inset:0;z-index:8;background:rgba(15,7,12,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .8s}
#gal.on{opacity:1;pointer-events:auto}
#pol{width:min(76vw,340px);background:#fffaf0;padding:12px 12px 14px;border-radius:3px;box-shadow:0 18px 50px rgba(0,0,0,.6);transition:opacity .35s,transform .5s}
#pol .ph{aspect-ratio:4/5;background:linear-gradient(160deg,#5a1230,#3b0a1b);display:flex;align-items:center;justify-content:center;font-size:64px;overflow:hidden}
#pol img{width:100%;height:100%;object-fit:cover;display:block}
#pol p{font-family:'Pinyon Script',cursive;font-size:30px;color:#3b0a1b;text-align:center;margin:10px 0 0;line-height:1.1;min-height:1.1em}
#dots{display:flex;gap:8px;margin-top:22px}
#dots b{width:7px;height:7px;border-radius:50%;background:var(--cream);opacity:.3}
#dots b.on{opacity:1;background:var(--gold)}
#gh{opacity:.6;font-size:16px;margin:14px 0 0}
#gx{position:absolute;top:10px;right:14px;background:none;border:0;color:var(--cream);font-size:36px;line-height:1;padding:8px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.c,#spot,#halo,.ln{transition-duration:.01s}.halo #sway,.end .f i,#intro .h{animation:none}.pho #pz{animation:none;opacity:1;transform:rotate(3deg)}}
</style>
</head>
<body>
<div id="st">
  <div id="spot"></div><div id="halo"></div>
  <svg id="plant" viewBox="0 0 300 470" aria-hidden="true">
    <defs>
      <radialGradient id="dc" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#6b3a12"/><stop offset="1" stop-color="#2e1606"/></radialGradient>
      <linearGradient id="pa" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#e08a00"/><stop offset="1" stop-color="#ffd34d"/></linearGradient>
      <linearGradient id="pb" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#c97400"/><stop offset="1" stop-color="#f4b400"/></linearGradient>
    </defs>
    <g id="sway">
      <path id="stem" pathLength="1" d="M150 470C148 390 154 300 150 215"/>
      <path class="lf a" d="M150 370C112 356 86 360 68 334C104 331 136 342 150 370Z"/>
      <path class="lf b" d="M150 325C188 311 214 315 232 289C196 286 164 297 150 325Z"/>
      <g id="fl" transform="translate(150 175)"></g>
      <g transform="translate(65 262)"><g id="pz">
        <rect x="3" y="6" width="170" height="158" fill="#000" opacity=".35"/>
        <rect width="170" height="158" rx="2" fill="#fffaf0"/>
        <g id="phph"><rect x="9" y="9" width="152" height="107" fill="#4a0f26"/><text x="85" y="72" text-anchor="middle" font-size="44">🌻</text></g>
        <svg id="phsvg" x="9" y="9" width="152" height="107" style="display:none"><image id="phimg" width="152" height="107" preserveAspectRatio="xMidYMid slice"/></svg>
        <text id="cap" x="85" y="143" text-anchor="middle" font-family="'Pinyon Script',cursive" font-size="18" fill="#3b0a1b"></text>
        <rect x="76" y="-15" width="18" height="28" rx="4" fill="#f4b400"/><rect x="76" y="-4" width="18" height="3" fill="#c97400"/>
      </g></g>
    </g>
  </svg>
  <div id="msg">
    <div class="ln n">Sharon</div>
    <div class="ln s">Hoy brillaste más que cualquier estrella.</div>
    <div class="ln m">Eres la mejor bonitaaaa</div>
    <div class="ln f">Te quiero muchisisisimo <i>💛</i></div>
  </div>
  <div class="c l"></div><div class="c r"></div>
  <div id="intro"><p class="a">Sharito </p><p class="b">esto es para ti</p><p class="h">toca para abrir el telón</p></div>
  <button id="again" onclick="location.reload()">Verlo otra vez</button>
</div>
<script>
const st=document.getElementById('st'),L=[...document.querySelectorAll('.ln')],NS='http://www.w3.org/2000/svg';
const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
function el(n,a,p){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e}
const fl=document.getElementById('fl');
[0,1].forEach(r=>{for(let i=0;i<20;i++){
  const g=el('g',{transform:'rotate('+(i*18+(r?9:0))+')'},fl);
  const p=el('ellipse',{cx:0,cy:r?-60:-70,rx:r?13:15,ry:r?30:38,fill:r?'url(#pb)':'url(#pa)'},g);
  p.setAttribute('class','pt');p.style.animationDelay=(r*.6+i*.07)+'s';}});
const ct=el('g',{},fl);ct.setAttribute('class','ct');ct.style.animationDelay='1.2s';
el('circle',{r:40,fill:'url(#dc)'},ct);
for(let i=1;i<110;i++){const a=i*137.508*Math.PI/180,d=3.5*Math.sqrt(i);
  el('circle',{cx:(d*Math.cos(a)).toFixed(1),cy:(d*Math.sin(a)).toFixed(1),r:1.5,fill:i%3?'#a8641c':'#d9902f'},ct);}
function petals(){if(rm)return;setInterval(()=>{
  const d=document.createElement('div');d.className='fp';
  d.style.left=Math.random()*100+'%';
  d.style.setProperty('--dx',(Math.random()*120-60)+'px');
  d.style.setProperty('--r',(Math.random()*720-360)+'deg');
  d.style.animationDuration=(6+Math.random()*5)+'s';
  d.style.transform='scale('+(.6+Math.random()*.8)+')';
  st.appendChild(d);d.addEventListener('animationend',()=>d.remove());},550);}
function run(){
  const T=(ms,f)=>setTimeout(f,ms),A=c=>st.classList.add(c);
  A('open');
  T(1800,()=>A('lit'));T(2400,()=>A('grow'));T(4300,()=>A('go'));
  T(7400,()=>{A('halo');petals()});T(7800,()=>A('pho'));
  T(8200,()=>L[0].classList.add('show'));
  T(10000,()=>L[1].classList.add('show'));
  T(12200,()=>L[2].classList.add('show'));
  T(14600,()=>{L[3].classList.add('show');A('end')});
  T(18000,()=>document.getElementById('again').classList.add('show'));
}
